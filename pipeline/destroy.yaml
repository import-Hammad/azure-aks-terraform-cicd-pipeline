trigger: none

parameters:
  - name: environment
    type: string
    values:
      - dev
      - staging
    default: dev

stages:
- stage: plan_destroy
  jobs:
  - job: plan_destroy
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/${{ parameters.environment }}'
        backendServiceArm: 'Azure subscription 1(<YOUR_SUBSCRIPTION_ID>)'
        backendAzureRmResourceGroupName: 'terraform-state-rg'
        backendAzureRmStorageAccountName: 'tf${{ replace(parameters.environment, ''staging'', ''stage'') }}backendhammad2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: '${{ replace(parameters.environment, ''staging'', ''stage'') }}.terraform.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/${{ parameters.environment }}'
        commandOptions: '-destroy'
        environmentServiceNameAzureRM: 'Azure subscription 1(<YOUR_SUBSCRIPTION_ID>)'

- stage: destroy_env
  dependsOn: plan_destroy
  condition: succeeded()
  jobs:
  - job: destroy
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/${{ parameters.environment }}'
        backendServiceArm: 'Azure subscription 1(<YOUR_SUBSCRIPTION_ID>)'
        backendAzureRmResourceGroupName: 'terraform-state-rg'
        backendAzureRmStorageAccountName: 'tf${{ replace(parameters.environment, ''staging'', ''stage'') }}backendhammad2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: '${{ replace(parameters.environment, ''staging'', ''stage'') }}.terraform.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'destroy'
        workingDirectory: '$(System.DefaultWorkingDirectory)/${{ parameters.environment }}'
        commandOptions: '--auto-approve'
        environmentServiceNameAzureRM: 'Azure subscription 1(<YOUR_SUBSCRIPTION_ID>)'
